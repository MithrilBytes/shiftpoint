# The accuracy the suite requires. These stop regression. They do not certify
# quality, and the honest way to raise one is to improve the tool until the
# number moves on its own, never by relabelling a case.
#
# Set a little under the last honest measurement so ordinary noise does not turn
# the build red.
#
# 2026-08-08: dropped from 0.70/0.65 after the corpus grew from 121 cases to
# 226. The tool did not get worse. The corpus got harder: the first 121 cases
# leaned toward web applications and static sites, and the 105 added after them
# are command line tools, bots, daemons, and stacks in languages this tool has
# only just learned to read. 57.8% on cases it has never been tuned against is
# what it actually scores.
tune:
  stage: 0.74
  flags: 0.94
holdout:
  stage: 0.55
  flags: 0.93
