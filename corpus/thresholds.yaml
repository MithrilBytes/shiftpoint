# The accuracy the suite requires. These exist to stop regression, not to
# certify quality. Raise one by improving the tool until the number moves on
# its own, never by relabelling a case.
#
# Set from the first honest measurement of 121 cases on 2026-08-08:
#   tune     stage 75.0%  flags 96.6%   n=88
#   holdout  stage 69.7%  flags 97.0%   n=33
#
# Each is set a little under what was measured, so ordinary noise does not turn
# the build red, and so a real regression does.
tune:
  stage: 0.70
  flags: 0.92
holdout:
  stage: 0.65
  flags: 0.92
