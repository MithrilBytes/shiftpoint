id: r2stack-laravel-mysql
origin: >-
  Laravel 11 invoicing app a joinery firm bills its customers from. Server
  rendered Blade pages, Eloquent models, migrations, and a managed MySQL that
  holds every invoice. The queue connection is sync, so nothing runs outside a
  request, but the database is the product and a PHP process has to be there to
  answer.
expect:
  stage: app-with-managed-database
  flags: []
files:
  composer.json: |
    {
      "name": "harlow/invoices",
      "type": "project",
      "require": {
        "php": "^8.2",
        "laravel/framework": "^11.0"
      },
      "autoload": { "psr-4": { "App\\": "app/" } }
    }
  .env.example: |
    APP_NAME=Invoices
    APP_ENV=production
    APP_URL=https://invoices.harlowjoinery.co.uk

    DB_CONNECTION=mysql
    DB_HOST=mysql.internal
    DB_PORT=3306
    DB_DATABASE=invoices
    DB_USERNAME=invoices

    SESSION_DRIVER=database
    QUEUE_CONNECTION=sync
  database/migrations/2024_02_11_000000_create_invoices_table.php: |
    <?php

    use Illuminate\Database\Migrations\Migration;
    use Illuminate\Database\Schema\Blueprint;
    use Illuminate\Support\Facades\Schema;

    return new class extends Migration {
        public function up(): void
        {
            Schema::create('invoices', function (Blueprint $table) {
                $table->id();
                $table->string('customer');
                $table->integer('pence');
                $table->date('due_on');
                $table->timestamp('paid_at')->nullable();
                $table->timestamps();
            });
        }
    };
  app/Models/Invoice.php: |
    <?php

    namespace App\Models;

    use Illuminate\Database\Eloquent\Model;

    class Invoice extends Model
    {
        protected $fillable = ['customer', 'pence', 'due_on'];

        public function scopeOverdue($query)
        {
            return $query->whereNull('paid_at')->where('due_on', '<', now());
        }
    }
  routes/web.php: |
    <?php

    use App\Models\Invoice;
    use Illuminate\Support\Facades\Route;

    Route::get('/', fn () => view('invoices.index', [
        'invoices' => Invoice::latest()->paginate(25),
    ]));

    Route::get('/overdue', fn () => view('invoices.index', [
        'invoices' => Invoice::overdue()->paginate(25),
    ]));
  README.md: |
    # invoices

    Invoicing for Harlow Joinery. Run `php artisan migrate`, then serve
    `public/`. Database credentials come from the environment.
