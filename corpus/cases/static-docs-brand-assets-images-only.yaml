id: static-docs-brand-assets-images-only
origin: "A brand asset repository: logos and icons in SVG and nothing else. Design teams keep these so engineers can pull an approved mark instead of screenshotting one, and there is no code in them at all."
expect:
  stage: static-site
  flags: []
files:
