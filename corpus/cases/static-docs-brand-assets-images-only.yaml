    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48">
      <text x="0" y="34" font-family="Inter" font-size="32" fill="#111">Kestrel</text>
    </svg>
  logo/wordmark-dark.svg: |
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48">
      <text x="0" y="34" font-family="Inter" font-size="32" fill="#fff">Kestrel</text>
    </svg>
