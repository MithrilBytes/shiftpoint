id: r2data-gradio-captioning-demo
origin: "A public demo of an image captioning model, the kind that gets pushed to a Hugging Face Space. Gradio is only the front door; the thing that decides what hardware this needs is the BLIP checkpoint sitting on the GPU. Two people a day or two thousand, you rent the same card."
expect:
  stage: model-runtime
  flags: []
files:
  requirements.txt: |
    gradio==4.41.0
    torch==2.4.0
    transformers==4.44.0
    pillow==10.4.0
  app.py: |
    import gradio as gr
    import torch
    from transformers import BlipForConditionalGeneration, BlipProcessor

    NAME = "Salesforce/blip-image-captioning-large"
    processor = BlipProcessor.from_pretrained(NAME)
    model = BlipForConditionalGeneration.from_pretrained(
        NAME, torch_dtype=torch.float16
    ).to("cuda")

    def caption(image, hint):
        inputs = processor(image, hint or None, return_tensors="pt").to(
            "cuda", torch.float16
        )
        tokens = model.generate(**inputs, max_new_tokens=40, num_beams=4)
        return processor.decode(tokens[0], skip_special_tokens=True)

    demo = gr.Interface(
        fn=caption,
        inputs=[gr.Image(type="pil"), gr.Textbox(label="Prompt prefix")],
        outputs=gr.Textbox(label="Caption"),
        examples=[["examples/pier.jpg", "a photo of"]],
        title="Caption anything",
    )

    if __name__ == "__main__":
        demo.launch(server_name="0.0.0.0")
  README.md: |
    ---
    title: Caption Anything
    sdk: gradio
    sdk_version: 4.41.0
    app_file: app.py
    ---

    # caption-anything

    BLIP large in fp16. Weights are 1.8 GB and it wants about 6 GB of VRAM to
    caption with four beams. On the free CPU hardware a single caption takes
    around 25 seconds, which is why the Space is on a T4.
