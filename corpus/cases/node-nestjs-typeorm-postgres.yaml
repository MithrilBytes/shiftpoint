id: node-nestjs-typeorm-postgres
origin: "A NestJS API with TypeORM over Postgres, the layout `nest new` produces once a database module is added."
expect:
  stage: app-on-free-managed-hosting-with-database
  flags: []
files:
  package.json: |
    {
      "name": "orders-api",
      "private": true,
      "scripts": { "start:prod": "node dist/main" },
      "dependencies": {
        "@nestjs/core": "^10.4.1",
        "@nestjs/common": "^10.4.1",
        "@nestjs/platform-express": "^10.4.1",
        "@nestjs/typeorm": "^10.0.2",
        "typeorm": "^0.3.20",
        "pg": "^8.12.0",
        "reflect-metadata": "^0.2.2",
        "rxjs": "^7.8.1"
      },
      "devDependencies": { "@nestjs/cli": "^10.4.4", "typescript": "^5.5.4" }
    }
  nest-cli.json: |
    {
      "$schema": "https://json.schemastore.org/nest-cli",
      "collection": "@nestjs/schematics",
      "sourceRoot": "src"
    }
  src/main.ts: |
    import { NestFactory } from "@nestjs/core";
    import { AppModule } from "./app.module";

    async function bootstrap() {
      const app = await NestFactory.create(AppModule);
      await app.listen(process.env.PORT ?? 3000);
    }

    bootstrap();
  src/app.module.ts: |
    import { Module } from "@nestjs/common";
    import { TypeOrmModule } from "@nestjs/typeorm";
    import { Order } from "./order.entity";

    @Module({
      imports: [
        TypeOrmModule.forRoot({
          type: "postgres",
          url: process.env.DATABASE_URL,
          entities: [Order],
        }),
        TypeOrmModule.forFeature([Order]),
      ],
    })
    export class AppModule {}
  src/order.entity.ts: |
    import { Column, Entity, PrimaryGeneratedColumn } from "typeorm";

    @Entity()
    export class Order {
      @PrimaryGeneratedColumn()
      id: number;

      @Column()
      reference: string;
    }
  .env.example: |
    DATABASE_URL=postgres://localhost:5432/orders
