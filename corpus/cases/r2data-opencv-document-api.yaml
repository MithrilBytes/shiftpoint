id: r2data-opencv-document-api
origin: "A document straightening endpoint: post a photo of a page, get back a deskewed, cropped PNG. It looks like computer vision and imports a large vision library, but there is no model anywhere in it, only contours and a perspective transform. Nothing is stored, nothing is held open and a request finishes in about 60 milliseconds on one core."
expect:
  stage: app-on-free-managed-hosting
  flags: []
files:
  requirements.txt: |
    fastapi==0.112.0
    uvicorn[standard]==0.30.5
    opencv-python-headless==4.10.0.84
    numpy==2.0.1
    python-multipart==0.0.9
  main.py: |
    import cv2
    import numpy as np
    from fastapi import FastAPI, UploadFile
    from fastapi.responses import Response

    app = FastAPI()

    def largest_quad(edges):
        contours, _ = cv2.findContours(
            edges, cv2.RETR_LIST, cv2.CHAIN_APPROX_SIMPLE
        )
        for contour in sorted(contours, key=cv2.contourArea, reverse=True)[:5]:
            approx = cv2.approxPolyDP(
                contour, 0.02 * cv2.arcLength(contour, True), True
            )
            if len(approx) == 4:
                return approx.reshape(4, 2).astype("float32")
        return None

    @app.post("/deskew")
    async def deskew(page: UploadFile):
        buffer = np.frombuffer(await page.read(), np.uint8)
        image = cv2.imdecode(buffer, cv2.IMREAD_COLOR)
        grey = cv2.cvtColor(image, cv2.COLOR_BGR2GRAY)
        quad = largest_quad(cv2.Canny(cv2.GaussianBlur(grey, (5, 5), 0), 70, 200))
        if quad is None:
            return Response(status_code=422)
        target = np.float32([[0, 0], [1240, 0], [1240, 1754], [0, 1754]])
        matrix = cv2.getPerspectiveTransform(quad, target)
        flat = cv2.warpPerspective(image, matrix, (1240, 1754))
        return Response(cv2.imencode(".png", flat)[1].tobytes(), media_type="image/png")

    @app.get("/healthz")
    def healthz():
        return {"ok": True}
  Dockerfile: |
    FROM python:3.11-slim
    RUN apt-get update && apt-get install -y libgl1 libglib2.0-0
    COPY requirements.txt .
    RUN pip install -r requirements.txt
    COPY main.py .
    CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
  README.md: |
    # deskew

    Geometry only: Canny, the biggest four sided contour, then a perspective
    warp. No OCR, no neural network, no weights to download.

    The image goes in and comes straight back out; nothing touches disk and
    nothing is kept between calls. Around 60 ms for a 12 megapixel phone photo
    on a single core.
