id: r2cli-homebrew-tap
origin: "A Homebrew tap: a directory of Ruby formula files that tell brew where to download somebody else's release archives and what to symlink. None of the software described here is in the repository, and the repository itself is a package index rather than a program."
expect:
  stage: unknown
  flags: []
files:
  Formula/gitstat.rb: |
    class Gitstat < Formula
      desc "Report commit statistics for a local repository"
      homepage "https://github.com/example/gitstat"
      url "https://github.com/example/gitstat/releases/download/v1.4.0/gitstat_1.4.0_darwin_arm64.tar.gz"
      sha256 "6b1f0c2f1c0c4c1f2f7b1a0d5e9a3c7d8e1f2a3b4c5d6e7f8091a2b3c4d5e6f7"
      version "1.4.0"
      license "MIT"

      def install
        bin.install "gitstat"
      end

      test do
        assert_match "gitstat 1.4.0", shell_output("#{bin}/gitstat --version")
      end
    end
  Formula/csvpeek.rb: |
    class Csvpeek < Formula
      desc "Summarise and slice CSV files from the terminal"
      homepage "https://github.com/example/csvpeek"
      url "https://github.com/example/csvpeek/archive/refs/tags/v0.9.2.tar.gz"
      sha256 "a1b2c3d4e5f60718293a4b5c6d7e8f9012a3b4c5d6e7f8091a2b3c4d5e6f7089"
      license "Apache-2.0"
      depends_on "rust" => :build

      def install
        system "cargo", "install", *std_cargo_args
      end
    end
  Casks/packetship.rb: |
    cask "packetship" do
      version "1.6.3"
      sha256 "0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0"

      url "https://dl.packetship.io/cli/#{version}/packetship.pkg"
      name "packetship CLI"
      homepage "https://packetship.io"

      pkg "packetship.pkg"
      uninstall pkgutil: "io.packetship.cli"
    end
  .github/workflows/tests.yml: |
    name: brew test-bot
    on: [push, pull_request]
    jobs:
      test-bot:
        runs-on: macos-14
        steps:
          - uses: Homebrew/actions/setup-homebrew@master
          - run: brew test-bot --only-tap-syntax
  README.md: |
    # homebrew-tools

    ```
    brew tap example/tools
    brew install gitstat csvpeek
    ```

    Formulae only. The programs themselves live in their own repositories.
