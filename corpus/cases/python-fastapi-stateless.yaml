id: python-fastapi-stateless
origin: "FastAPI service that only reshapes calls to a third party API and stores nothing of its own."
expect:
  stage: app-on-free-managed-hosting
  flags: []
files:
  requirements.txt: |
    fastapi==0.111.0
    uvicorn[standard]==0.30.1
    httpx==0.27.0
  main.py: |
    import os
    import httpx
    from fastapi import FastAPI

    app = FastAPI()
    BASE = "https://api.exchangerate.host"

    @app.get("/rate/{pair}")
    async def rate(pair: str):
        base, quote = pair.split("-")
        async with httpx.AsyncClient() as client:
            response = await client.get(
                f"{BASE}/latest",
                params={"base": base, "symbols": quote, "access_key": os.environ["FX_KEY"]},
            )
        return {"pair": pair, "rate": response.json()["rates"][quote]}
  .env.example: |
    FX_KEY=replace-me
