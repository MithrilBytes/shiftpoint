id: python-ml-inference-service
origin: "FastAPI wrapper around a transformers sentiment model loaded into memory at startup, the usual first shape of an in-house inference service."
expect:
  stage: model-runtime
  flags: []
files:
  requirements.txt: |
    fastapi==0.111.0
    uvicorn[standard]==0.30.1
    torch==2.3.1
    transformers==4.43.1
  main.py: |
    from fastapi import FastAPI
    from pydantic import BaseModel
    from transformers import pipeline

    app = FastAPI()
    classifier = pipeline(
        "sentiment-analysis",
        model="distilbert-base-uncased-finetuned-sst-2-english",
    )

    class Request(BaseModel):
        text: str

    @app.post("/classify")
    def classify(request: Request):
        return classifier(request.text)[0]
  Dockerfile: |
    FROM python:3.11-slim
    WORKDIR /app
    COPY requirements.txt .
    RUN pip install --no-cache-dir -r requirements.txt
    COPY . .
    CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
  README.md: |
    # sentiment

    Loads the model once at startup and answers on /classify.
