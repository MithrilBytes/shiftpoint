id: r2edge-generated-client-sdk
origin: "The Python client for a billing API, generated from an OpenAPI document by openapi-generator and committed whole: about 900 files, one per model and one per tag, none of them written by a person. It is published to PyPI and imported by other people's services. The api/ directory is full of callers, not handlers."
expect:
  stage: library
  flags: []
files:
  README.md: |
    # acme-api-client

    This code was generated by OpenAPI Generator 7.4.0. Do not edit by hand;
    regenerate from `openapi.yaml` and commit the result.

    ```
    pip install acme-api-client
    ```

    ```python
    from openapi_client import ApiClient, Configuration, InvoicesApi

    api = InvoicesApi(ApiClient(Configuration(host="https://api.acme.example")))
    api.list_invoices(limit=25)
    ```
  pyproject.toml: |
    [project]
    name = "acme-api-client"
    version = "7.4.0"
    description = "Generated client for the Acme billing API"
    requires-python = ">=3.8"
    dependencies = [
      "urllib3>=2.1.0",
      "python-dateutil>=2.8.2",
      "pydantic>=2.5.0",
      "typing-extensions>=4.7.1",
    ]
  .openapi-generator/FILES: |
    .gitignore
    README.md
    docs/Invoice.md
    docs/InvoicesApi.md
    openapi_client/__init__.py
    openapi_client/api/invoices_api.py
    openapi_client/api_client.py
    openapi_client/models/invoice.py
  .openapi-generator-ignore: |
    README.md
    pyproject.toml
  openapi_client/api/invoices_api.py: |
