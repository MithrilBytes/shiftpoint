id: r2infra-tiny-flask-api-k8s-manifests
origin: "An internal Flask service with one endpoint that normalises phone numbers for the CRM. No store, no queue, a few thousand calls a day. Someone added a full Deployment, Service and Ingress because the platform team said everything ships to the cluster."
expect:
  stage: app-on-free-managed-hosting
  flags: [kubernetes-without-demand]
files:
  requirements.txt: |
    flask==3.0.3
    gunicorn==22.0.0
    phonenumbers==8.13.40
  app.py: |
    from flask import Flask, jsonify, request
    import phonenumbers

    app = Flask(__name__)

    @app.post("/normalise")
    def normalise():
        body = request.get_json()
        parsed = phonenumbers.parse(body["number"], body.get("region", "GB"))
        return jsonify(
            e164=phonenumbers.format_number(parsed, phonenumbers.PhoneNumberFormat.E164),
            valid=phonenumbers.is_valid_number(parsed),
        )

    @app.get("/healthz")
    def healthz():
        return "ok"
  Dockerfile: |
    FROM python:3.12-slim
    WORKDIR /app
    COPY requirements.txt .
    RUN pip install --no-cache-dir -r requirements.txt
    COPY app.py .
    CMD ["gunicorn", "-b", "0.0.0.0:8000", "app:app"]
  k8s/deployment.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: phone-normaliser
      namespace: crm
    spec:
      replicas: 2
      selector:
        matchLabels:
          app: phone-normaliser
      template:
        metadata:
          labels:
            app: phone-normaliser
        spec:
          containers:
            - name: web
              image: ghcr.io/acme/phone-normaliser:1.4.0
              ports:
                - containerPort: 8000
              readinessProbe:
                httpGet:
                  path: /healthz
                  port: 8000
  k8s/service.yaml: |
    apiVersion: v1
    kind: Service
    metadata:
      name: phone-normaliser
      namespace: crm
    spec:
      selector:
        app: phone-normaliser
      ports:
        - port: 80
          targetPort: 8000
  k8s/ingress.yaml: |
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: phone-normaliser
      namespace: crm
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
    spec:
      rules:
        - host: phone.internal.acme.dev
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: phone-normaliser
                    port:
                      number: 80
