id: ruby-go-rails-helm-chart-single-app
origin: "One Rails app with Postgres that carries a Helm chart of its own, usually because the platform team at a previous job wrote one. Helm manages releases across a fleet, and this repository holds a single app."
expect:
  stage: app-on-free-managed-hosting-with-database
  flags: [kubernetes-without-demand, helm-without-demand]
files:
  Gemfile: |
    source "https://rubygems.org"
    gem "rails", "~> 7.1.3"
    gem "pg", "~> 1.5"
    gem "puma", ">= 6.4"
  app/controllers/reports_controller.rb: |
    class ReportsController < ApplicationController
      def index
        @reports = Report.order(:name)
      end
    end
  chart/Chart.yaml: |
    apiVersion: v2
    name: reports
    description: The reports app
    version: 0.3.1
    appVersion: "1.0.0"
  chart/values.yaml: |
    replicaCount: 4
    image:
      repository: example/reports
      tag: latest
    resources:
      requests:
        cpu: 500m
  chart/templates/deployment.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: {{ .Release.Name }}
    spec:
      replicas: {{ .Values.replicaCount }}
      template:
        spec:
          containers:
            - name: {{ .Chart.Name }}
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
  config/database.yml: |
    production:
      adapter: postgresql
      url: <%= ENV["DATABASE_URL"] %>
