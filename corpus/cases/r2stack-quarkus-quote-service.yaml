id: r2stack-quarkus-quote-service
origin: >-
  A Quarkus service a freight broker runs to price consignments. It takes a
  consignment on the way in, asks each carrier's REST API what they would
  charge, and returns the cheapest. It stores nothing: no datasource, no
  persistence extension, no cache that outlives a request. Built to a native
  image, so it is a small stateless container, but it is the pricing engine of
  a trading company and no free plan covers that.
expect:
  stage: commercial-app-on-managed-hosting
  flags: []
files:
  pom.xml: |
    <project xmlns="http://maven.apache.org/POM/4.0.0">
      <modelVersion>4.0.0</modelVersion>
      <groupId>ltd.fenwickfreight</groupId>
      <artifactId>quotes</artifactId>
      <version>2.1.3</version>
      <properties>
        <maven.compiler.release>21</maven.compiler.release>
        <quarkus.platform.version>3.13.0</quarkus.platform.version>
      </properties>
      <dependencies>
        <dependency>
          <groupId>io.quarkus</groupId>
          <artifactId>quarkus-rest-jackson</artifactId>
        </dependency>
        <dependency>
          <groupId>io.quarkus</groupId>
          <artifactId>quarkus-rest-client-jackson</artifactId>
        </dependency>
      </dependencies>
    </project>
  src/main/resources/application.properties: |
    quarkus.http.port=8080
    quarkus.native.container-build=true

    quarkus.rest-client.palletline.url=https://api.palletline.example/v3
    quarkus.rest-client.northroad.url=https://partners.northroad.example/rates
    quarkus.rest-client.read-timeout=4000
  src/main/java/ltd/fenwickfreight/quotes/QuoteResource.java: |
    package ltd.fenwickfreight.quotes;

    import jakarta.inject.Inject;
    import jakarta.ws.rs.Consumes;
    import jakarta.ws.rs.POST;
    import jakarta.ws.rs.Path;
    import jakarta.ws.rs.Produces;
    import jakarta.ws.rs.core.MediaType;
    import java.util.Comparator;
    import java.util.List;

    @Path("/quotes")
    @Consumes(MediaType.APPLICATION_JSON)
    @Produces(MediaType.APPLICATION_JSON)
    public class QuoteResource {

        @Inject
        List<CarrierClient> carriers;

        @POST
        public Quote cheapest(Consignment consignment) {
            return carriers.stream()
                .map(c -> c.price(consignment))
                .min(Comparator.comparingLong(Quote::pence))
                .orElseThrow();
        }
    }
  src/main/java/ltd/fenwickfreight/quotes/CarrierClient.java: |
    package ltd.fenwickfreight.quotes;

    public interface CarrierClient {
        String name();

        Quote price(Consignment consignment);
    }
  src/main/docker/Dockerfile.native: |
    FROM quay.io/quarkus/quarkus-micro-image:2.0
    WORKDIR /work
    COPY target/*-runner /work/application
    EXPOSE 8080
    CMD ["./application", "-Dquarkus.http.host=0.0.0.0"]
  README.md: |
    # quotes

    Pricing service for Fenwick Freight Ltd. Every quote is worked out from the
    carriers' APIs at request time and thrown away afterwards, so instances are
    interchangeable and can be replaced mid-shift.
