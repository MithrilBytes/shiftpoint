id: infra-overkill-terraform-eks-tiny-api
origin: >-
  One tiny Express API whose repository provisions its own EKS cluster and a
  managed node group in Terraform. A real and expensive pattern: the Kubernetes
  is declared in HCL rather than in checked in manifests, but it is the same
  cluster and the same bill.
expect:
  stage: app-on-free-managed-hosting
  flags:
    - kubernetes-without-demand
files:
  package.json: |
    {
      "name": "shorten",
      "version": "0.1.0",
      "private": true,
      "scripts": { "start": "node server.js" },
      "dependencies": { "express": "^4.19.2" }
    }
  server.js: |
    const express = require("express");
    const app = express();
    const links = new Map();

    app.post("/:code", (req, res) => {
      links.set(req.params.code, req.query.url);
      res.status(201).end();
    });

    app.get("/:code", (req, res) => res.redirect(links.get(req.params.code) || "/"));

    app.listen(process.env.PORT || 8080);
  Dockerfile: |
    FROM node:20-alpine
    WORKDIR /app
    COPY . .
    RUN npm ci --omit=dev
    CMD ["node", "server.js"]
  infra/eks.tf: |
    resource "aws_eks_cluster" "main" {
      name     = "shorten"
      role_arn = aws_iam_role.cluster.arn

      vpc_config {
        subnet_ids = var.subnet_ids
      }
    }

    resource "aws_eks_node_group" "default" {
      cluster_name    = aws_eks_cluster.main.name
      node_group_name = "default"
      node_role_arn   = aws_iam_role.node.arn
      subnet_ids      = var.subnet_ids
      instance_types  = ["t3.medium"]

      scaling_config {
        desired_size = 2
        min_size     = 2
        max_size     = 6
      }
    }
  infra/versions.tf: |
    terraform {
      required_version = ">= 1.7"

      required_providers {
        aws = {
          source  = "hashicorp/aws"
          version = "~> 5.0"
        }
      }
    }
  README.md: |
    # shorten

    URL shortener. `terraform -chdir=infra apply` creates the cluster, then the
    image is rolled out onto it.
