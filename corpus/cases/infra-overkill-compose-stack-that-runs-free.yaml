id: infra-overkill-compose-stack-that-runs-free
origin: >-
  A stateless Express API whose only deployment path is `docker compose up` on
  a rented VPS, with nginx in front of it for TLS. No database, no queue,
  nothing held open. The compose file is the deploy, and the whole thing would
  sit on a free managed tier unchanged.
expect:
  stage: app-on-free-managed-hosting
  flags:
    - composed-stack-that-runs-free
files:
  package.json: |
    {
      "name": "unitconv",
      "version": "1.0.1",
      "private": true,
      "scripts": { "start": "node server.js" },
      "dependencies": { "express": "^4.19.2" }
    }
  server.js: |
    const express = require("express");
    const app = express();

    const FACTORS = { km_mi: 0.621371, kg_lb: 2.20462, c_f: 1.8 };

    app.get("/convert", (req, res) => {
      const factor = FACTORS[req.query.pair];
      if (!factor) return res.status(400).json({ error: "unknown pair" });
      res.json({ value: Number(req.query.value) * factor });
    });

    app.listen(3000);
  Dockerfile: |
    FROM node:20-alpine
    WORKDIR /app
    COPY . .
    RUN npm ci --omit=dev
    CMD ["node", "server.js"]
  docker-compose.yml: |
    services:
      app:
        build: .
        restart: unless-stopped
        expose:
          - "3000"
      proxy:
        image: nginx:1.27-alpine
        restart: unless-stopped
        ports:
          - "80:80"
          - "443:443"
        volumes:
          - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on: [app]
  nginx.conf: |
    server {
      listen 80;
      server_name convert.example.com;

      location / {
        proxy_pass http://app:3000;
      }
    }
  README.md: |
    # unitconv

    Unit conversion API. Deploy is `docker compose up -d` on the VPS.
