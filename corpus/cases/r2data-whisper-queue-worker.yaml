id: r2data-whisper-queue-worker
origin: "A batch transcription worker: episodes are pushed onto a Redis queue by another service and this pulls them off and runs Whisper large on a GPU. There is no HTTP surface at all. The queue tells you how many of these to run; the checkpoint tells you how big each one has to be, and that is the part nobody can price by traffic."
expect:
  stage: model-runtime
  flags: []
files:
  requirements.txt: |
    faster-whisper==1.0.3
    torch==2.4.0
    rq==1.16.2
    redis==5.0.8
    boto3==1.34.152
  worker.py: |
    import os
    import tempfile

    import boto3
    from faster_whisper import WhisperModel

    MODEL = WhisperModel("large-v3", device="cuda", compute_type="float16")
    s3 = boto3.client("s3")

    def transcribe(bucket: str, key: str) -> str:
        with tempfile.NamedTemporaryFile(suffix=".mp3") as handle:
            s3.download_fileobj(bucket, key, handle)
            handle.flush()
            segments, _ = MODEL.transcribe(handle.name, vad_filter=True)
            text = "\n".join(
                f"[{segment.start:.1f}] {segment.text.strip()}"
                for segment in segments
            )
        s3.put_object(
            Bucket=bucket, Key=key.replace(".mp3", ".txt"), Body=text.encode()
        )
        return key
  entrypoint.sh: |
    #!/bin/sh
    exec rq worker transcription --url "$REDIS_URL"
  docker-compose.yml: |
    services:
      redis:
        image: redis:7
      worker:
        build: .
        environment:
          REDIS_URL: redis://redis:6379/0
        depends_on: [redis]
        deploy:
          resources:
            reservations:
              devices:
                - capabilities: [gpu]
  Dockerfile: |
    FROM nvidia/cuda:12.4.1-cudnn-runtime-ubuntu22.04
    RUN apt-get update && apt-get install -y python3-pip ffmpeg
    COPY requirements.txt .
    RUN pip3 install -r requirements.txt
    COPY worker.py entrypoint.sh ./
    CMD ["sh", "entrypoint.sh"]
  README.md: |
    # transcribe-worker

    Pulls jobs off the `transcription` queue and writes the transcript back next
    to the audio. Nothing calls it directly and it serves no requests.

    large-v3 in float16 wants about 10 GB of VRAM and holds it for the life of
    the process, because reloading between episodes costs more than the episode
    does. A 45 minute show takes roughly 4 minutes on an L4.
