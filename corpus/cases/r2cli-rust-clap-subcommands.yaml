id: r2cli-rust-clap-subcommands
origin: "A Rust command line tool with clap subcommands for inspecting CSV files on disk. People install it with cargo install or unpack a release archive. It opens a file, prints a summary, and exits. Nothing outlives the invocation and nothing is hosted."
expect:
  stage: command-line-tool
  flags: []
files:
  Cargo.toml: |
    [package]
    name = "csvpeek"
    version = "0.9.2"
    edition = "2021"
    description = "Summarise and slice CSV files from the terminal"
    license = "Apache-2.0"
    repository = "https://github.com/example/csvpeek"

    [dependencies]
    clap = { version = "4.5", features = ["derive"] }
    csv = "1.3"
    anyhow = "1.0"
  src/main.rs: |
    use clap::{Parser, Subcommand};
    use anyhow::Result;

    #[derive(Parser)]
    #[command(name = "csvpeek", version)]
    struct Cli {
        #[command(subcommand)]
        command: Command,
    }

    #[derive(Subcommand)]
    enum Command {
        /// Print column names and inferred types
        Schema { path: String },
        /// Print the first N rows as a table
        Head { path: String, #[arg(short, long, default_value_t = 10)] rows: usize },
    }

    fn main() -> Result<()> {
        match Cli::parse().command {
            Command::Schema { path } => csvpeek::schema(&path),
            Command::Head { path, rows } => csvpeek::head(&path, rows),
        }
    }
  src/lib.rs: |
    use anyhow::Result;

    pub fn schema(path: &str) -> Result<()> {
        let mut reader = csv::Reader::from_path(path)?;
        for name in reader.headers()?.iter() {
            println!("{name}");
        }
        Ok(())
    }

    pub fn head(path: &str, rows: usize) -> Result<()> {
        let mut reader = csv::Reader::from_path(path)?;
        for record in reader.records().take(rows) {
            println!("{}", record?.iter().collect::<Vec<_>>().join("\t"));
        }
        Ok(())
    }
  README.md: |
    # csvpeek

    ```
    cargo install csvpeek
    csvpeek schema sales.csv
    csvpeek head sales.csv --rows 20
    ```

    Reads a file, writes to stdout, exits. No config file, no daemon.
