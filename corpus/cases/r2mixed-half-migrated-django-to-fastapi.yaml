id: r2mixed-half-migrated-django-to-fastapi
origin: >-
  An internal ops app caught halfway through a rewrite. The Django app still
  serves most of the site and owns the schema; a new FastAPI service serves the
  two endpoints that have been ported and talks to the same Postgres. Both are
  deployed, on the same box, with nginx routing by path prefix. This state has
  lasted eight months and will last a while longer.
expect:
  stage: app-with-managed-database
  flags: []
files:
  requirements.txt: |
    Django==5.0.7
    psycopg[binary]==3.2.1
    gunicorn==22.0.0
    fastapi==0.111.0
    uvicorn==0.30.1
    SQLAlchemy==2.0.31
  legacy/settings.py: |
    import os

    DATABASES = {
        "default": {
            "ENGINE": "django.db.backends.postgresql",
            "NAME": os.environ["PGDATABASE"],
            "HOST": os.environ["PGHOST"],
            "USER": os.environ["PGUSER"],
            "PASSWORD": os.environ["PGPASSWORD"],
            "CONN_MAX_AGE": 60,
        }
    }
    INSTALLED_APPS = ["django.contrib.admin", "django.contrib.auth", "legacy.shipments"]
    ROOT_URLCONF = "legacy.urls"
  legacy/urls.py: |
    from django.contrib import admin
    from django.urls import path
    from legacy.shipments import views

    urlpatterns = [
        path("admin/", admin.site.urls),
        path("", views.dashboard),
        path("shipments/<int:pk>/", views.detail),
        path("carriers/", views.carriers),
    ]
  legacy/shipments/models.py: |
    from django.db import models

    class Shipment(models.Model):
        reference = models.CharField(max_length=32, unique=True)
        carrier = models.ForeignKey("Carrier", on_delete=models.PROTECT)
        delivered_at = models.DateTimeField(null=True, blank=True)
  api/main.py: |
    from fastapi import FastAPI
    from sqlalchemy import create_engine, text
    import os

    engine = create_engine(os.environ["DATABASE_URL"], pool_size=5)
    app = FastAPI(title="ops v2")

    @app.get("/v2/shipments/{ref}")
    def shipment(ref: str):
        with engine.connect() as conn:
            row = conn.execute(
                text("select reference, delivered_at from shipments_shipment where reference = :r"),
                {"r": ref},
            ).mappings().first()
        return dict(row) if row else {"error": "not found"}
  nginx.conf: |
    upstream django { server 127.0.0.1:8000; }
    upstream fastapi { server 127.0.0.1:8001; }

    server {
      listen 80;

      location /v2/ {
        proxy_pass http://fastapi;
      }

      location / {
        proxy_pass http://django;
      }
    }
  README.md: |
    # ops

    Mid migration. Django still owns the models and the migrations, and still
    serves everything except `/v2/`. New endpoints are written in `api/` and
    read the same Postgres tables directly until the schema moves. Both
    processes run under systemd on the app box behind the nginx config above.
    Do not add new views to `legacy/`.
