id: static-docs-astro-content-blog
origin: "An Astro content blog with no adapter configured. Astro's default output is static: `astro build` writes a dist/ of HTML and there is no server to run. Adding an adapter is the deliberate act that changes that, and this repository has not done it."
expect:
  stage: static-site
  flags: []
files:
  package.json: |
    {
      "name": "slipstream-blog",
      "private": true,
      "scripts": {
        "build": "astro build",
        "dev": "astro dev"
      },
      "dependencies": {
        "astro": "^4.15.0",
        "@astrojs/mdx": "^3.1.5",
        "@astrojs/sitemap": "^3.1.6"
      }
    }
  astro.config.mjs: |
    import { defineConfig } from "astro/config";
    import mdx from "@astrojs/mdx";
    import sitemap from "@astrojs/sitemap";

    export default defineConfig({
      site: "https://slipstream.example",
      integrations: [mdx(), sitemap()],
    });
  src/pages/index.astro: |
    ---
    import { getCollection } from "astro:content";
    const posts = await getCollection("posts");
    ---
    <html lang="en">
      <body>
        <h1>Slipstream</h1>
        {posts.map((p) => <a href={`/posts/${p.slug}`}>{p.data.title}</a>)}
      </body>
    </html>
  src/content/config.ts: |
    import { defineCollection, z } from "astro:content";

    export const collections = {
      posts: defineCollection({ schema: z.object({ title: z.string() }) }),
    };
  src/content/posts/drag-coefficients.mdx: |
    ---
    title: Drag coefficients for people who are not engineers
    ---

    A shape that looks fast and a shape that is fast are different shapes.
