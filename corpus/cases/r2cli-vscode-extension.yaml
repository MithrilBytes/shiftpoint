id: r2cli-vscode-extension
origin: "A VS Code extension published to the marketplace: an engines.vscode range, activation events, contributed commands, and an activate function. It is an npm package that other people install, and the editor on their laptop is the only thing that ever loads it. There is no entry point a person runs and nothing to host."
expect:
  stage: library
  flags: []
files:
  package.json: |
    {
      "name": "todo-lens",
      "displayName": "TODO Lens",
      "description": "Show TODO and FIXME comments as a tree in the sidebar",
      "version": "0.5.1",
      "publisher": "example",
      "engines": { "vscode": "^1.88.0" },
      "categories": ["Other"],
      "activationEvents": ["onStartupFinished"],
      "main": "./out/extension.js",
      "contributes": {
        "commands": [
          { "command": "todoLens.refresh", "title": "TODO Lens: Refresh" }
        ],
        "views": {
          "explorer": [{ "id": "todoLens", "name": "TODO Lens" }]
        },
        "configuration": {
          "properties": {
            "todoLens.pattern": { "type": "string", "default": "TODO|FIXME" }
          }
        }
      },
      "scripts": {
        "compile": "tsc -p ./",
        "package": "vsce package"
      },
      "devDependencies": {
        "@types/vscode": "^1.88.0",
        "typescript": "^5.4.0",
        "@vscode/vsce": "^2.26.0"
      }
    }
  src/extension.ts: |
    import * as vscode from "vscode";
    import { TodoProvider } from "./provider";

    export function activate(context: vscode.ExtensionContext) {
      const provider = new TodoProvider();
      context.subscriptions.push(
        vscode.window.registerTreeDataProvider("todoLens", provider),
        vscode.commands.registerCommand("todoLens.refresh", () => provider.refresh()),
        vscode.workspace.onDidSaveTextDocument(() => provider.refresh()),
      );
    }

    export function deactivate() {}
  src/provider.ts: |
    import * as vscode from "vscode";

    export class TodoProvider implements vscode.TreeDataProvider<vscode.TreeItem> {
      private changed = new vscode.EventEmitter<void>();
      readonly onDidChangeTreeData = this.changed.event;

      refresh() {
        this.changed.fire();
      }

      getTreeItem(item: vscode.TreeItem) {
        return item;
      }

      async getChildren(): Promise<vscode.TreeItem[]> {
        const pattern = vscode.workspace.getConfiguration("todoLens").get<string>("pattern")!;
        const files = await vscode.workspace.findFiles("**/*.{ts,js,py,go}", "**/node_modules/**");
        const items: vscode.TreeItem[] = [];
        for (const file of files) {
          const text = (await vscode.workspace.openTextDocument(file)).getText();
          if (new RegExp(pattern).test(text)) {
            items.push(new vscode.TreeItem(vscode.workspace.asRelativePath(file)));
          }
        }
        return items;
      }
    }
  tsconfig.json: |
    {
      "compilerOptions": {
        "module": "commonjs",
        "target": "ES2022",
        "outDir": "out",
        "strict": true
      },
      "exclude": ["node_modules"]
    }
  .vscodeignore: |
    src/**
    tsconfig.json
    **/*.map
  README.md: |
    # TODO Lens

    Install from the Marketplace, or `code --install-extension example.todo-lens`.
    Everything happens inside your editor.
