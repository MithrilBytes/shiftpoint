id: ruby-go-rails-postgres-web
origin: "A plain Rails 7 CRUD app with managed Postgres and no background work. The shape a Rails developer produces on day one of a side project."
expect:
  stage: app-on-free-managed-hosting-with-database
  flags: []
files:
  Gemfile: |
    source "https://rubygems.org"
    gem "rails", "~> 7.1.3"
    gem "pg", "~> 1.5"
    gem "puma", ">= 6.4"
    gem "bootsnap", require: false
  config/database.yml: |
    production:
      adapter: postgresql
      url: <%= ENV["DATABASE_URL"] %>
  config/routes.rb: |
    Rails.application.routes.draw do
      resources :articles
      root "articles#index"
    end
  app/models/article.rb: |
    class Article < ApplicationRecord
      validates :title, presence: true
    end
  app/controllers/articles_controller.rb: |
    class ArticlesController < ApplicationController
      def index
        @articles = Article.order(created_at: :desc).limit(50)
      end
    end
