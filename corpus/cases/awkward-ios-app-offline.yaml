id: awkward-ios-app-offline
origin: "A SwiftUI iPhone app that keeps everything on the device with SwiftData and syncs through the user's own iCloud. It ships through the App Store, and the developer's hosting bill is zero forever: there is no server in this product, only a $99 a year developer account, which is not infrastructure."
expect:
  stage: unknown
  flags: []
files:
  project.yml: |
    name: Habits
    options:
      bundleIdPrefix: org.example
      deploymentTarget:
        iOS: "17.0"
    targets:
      Habits:
        type: application
        platform: iOS
        sources: [Sources]
        info:
          path: Sources/Info.plist
  Sources/HabitsApp.swift: |
    import SwiftUI
    import SwiftData

    @main
    struct HabitsApp: App {
        var body: some Scene {
            WindowGroup {
                ContentView()
            }
            .modelContainer(for: Habit.self)
        }
    }
  Sources/ContentView.swift: |
    import SwiftUI
    import SwiftData

    struct ContentView: View {
        @Query(sort: \Habit.createdAt) private var habits: [Habit]

        var body: some View {
            NavigationStack {
                List(habits) { habit in
                    Text(habit.name)
                }
                .navigationTitle("Habits")
            }
        }
    }
  Sources/Habit.swift: |
    import Foundation
    import SwiftData

    @Model
    final class Habit {
        var name: String
        var createdAt: Date
        var completions: [Date]

        init(name: String) {
            self.name = name
            self.createdAt = .now
            self.completions = []
        }
    }
  fastlane/Fastfile: |
    default_platform(:ios)

    platform :ios do
      lane :beta do
        build_app(scheme: "Habits")
        upload_to_testflight
      end
    end
  README.md: |
    # Habits

    Offline first. SwiftData on device, optional CloudKit sync through the
    user's own iCloud account. No backend, no accounts, no analytics.
