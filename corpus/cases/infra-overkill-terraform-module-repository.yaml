id: infra-overkill-terraform-module-repository
origin: >-
  A reusable Terraform module published for other repositories to reference by
  source. There is no application here and nothing to deploy: the module is the
  deliverable, exactly like a package on a registry.
expect:
  stage: library
  flags: []
files:
  main.tf: |
    resource "aws_s3_bucket" "this" {
      bucket = var.name
    }

    resource "aws_s3_bucket_versioning" "this" {
      bucket = aws_s3_bucket.this.id

      versioning_configuration {
        status = var.versioning ? "Enabled" : "Suspended"
      }
    }
  variables.tf: |
    variable "name" {
      description = "Bucket name"
      type        = string
    }

    variable "versioning" {
      description = "Whether to keep object versions"
      type        = bool
      default     = true
    }
  outputs.tf: |
    output "bucket_arn" {
      value = aws_s3_bucket.this.arn
    }

    output "bucket_id" {
      value = aws_s3_bucket.this.id
    }
  versions.tf: |
    terraform {
      required_version = ">= 1.5"

      required_providers {
        aws = {
          source  = "hashicorp/aws"
          version = ">= 5.0"
        }
      }
    }
  examples/simple/main.tf: |
    module "bucket" {
      source = "../../"
      name   = "example-artifacts"
    }
  README.md: |
    # terraform-aws-artifact-bucket

    A module, not a deployment.

    ```hcl
    module "bucket" {
      source = "github.com/example/terraform-aws-artifact-bucket"
      name   = "my-artifacts"
    }
    ```
