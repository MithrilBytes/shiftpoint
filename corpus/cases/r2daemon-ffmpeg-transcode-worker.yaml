id: r2daemon-ffmpeg-transcode-worker
origin: "The transcoding half of a video site. The upload API pushes a job onto Redis and this repository is the Celery worker that drains it: pull the source from object storage, shell out to ffmpeg for three renditions, write them back. Jobs are slow and retried, so the worker and the broker both have to be there."
expect:
  stage: app-with-background-work
  flags: []
files:
  requirements.txt: |
    celery[redis]==5.4.0
    boto3==1.34.144
  celery_app.py: |
    import os
    from celery import Celery

    app = Celery("transcode", broker=os.environ["REDIS_URL"], backend=os.environ["REDIS_URL"])
    app.conf.update(
        task_acks_late=True,
        worker_prefetch_multiplier=1,
        task_default_queue="transcode",
        broker_transport_options={"visibility_timeout": 7200},
    )
  tasks.py: |
    import subprocess
    import tempfile

    from celery_app import app
    from storage import download, upload

    RENDITIONS = [("1080p", "1920:-2", "5000k"), ("720p", "1280:-2", "2500k"), ("360p", "640:-2", "800k")]

    @app.task(bind=True, max_retries=3, default_retry_delay=120)
    def transcode(self, asset_key):
        with tempfile.TemporaryDirectory() as work:
            source = download(asset_key, work)
            for name, scale, bitrate in RENDITIONS:
                out = f"{work}/{name}.mp4"
                subprocess.run(
                    ["ffmpeg", "-y", "-i", source, "-vf", f"scale={scale}",
                     "-b:v", bitrate, "-c:a", "aac", out],
                    check=True,
                )
                upload(out, f"renditions/{asset_key}/{name}.mp4")
  storage.py: |
    import os
    import boto3

    s3 = boto3.client("s3")
    BUCKET = os.environ["MEDIA_BUCKET"]

    def download(key, into):
        path = f"{into}/source"
        s3.download_file(BUCKET, key, path)
        return path

    def upload(path, key):
        s3.upload_file(path, BUCKET, key)
  Dockerfile: |
    FROM python:3.12-slim
    RUN apt-get update && apt-get install -y --no-install-recommends ffmpeg && rm -rf /var/lib/apt/lists/*
    WORKDIR /app
    COPY requirements.txt .
    RUN pip install --no-cache-dir -r requirements.txt
    COPY . .
    CMD ["celery", "-A", "tasks", "worker", "-Q", "transcode", "--concurrency", "2"]
  .env.example: |
    REDIS_URL=redis://localhost:6379/0
    MEDIA_BUCKET=
  README.md: |
    # transcode-worker

    There is no web process in this repository; the API that enqueues lives
    elsewhere. A 4k source takes twenty minutes, so concurrency is low and
    the visibility timeout is long.
