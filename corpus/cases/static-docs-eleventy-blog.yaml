id: static-docs-eleventy-blog
origin: "An Eleventy blog: Nunjucks templates, markdown posts, output to _site. Eleventy has no server side at runtime, which is the whole reason people pick it."
expect:
  stage: static-site
  flags: []
files:
  package.json: |
    {
      "name": "quiet-hours",
      "private": true,
      "scripts": {
        "build": "eleventy",
        "serve": "eleventy --serve"
      },
      "devDependencies": {
        "@11ty/eleventy": "^3.0.0",
        "luxon": "^3.4.4"
      }
    }
  eleventy.config.js: |
    export default function (config) {
      config.addPassthroughCopy("src/css");
      return { dir: { input: "src", output: "_site" } };
    }
  src/index.njk: |
    ---
    layout: base.njk
    title: Quiet Hours
    ---
    <h1>Quiet Hours</h1>
    {% for post in collections.post %}
      <a href="{{ post.url }}">{{ post.data.title }}</a>
    {% endfor %}
  src/_includes/base.njk: |
    <!doctype html>
    <html lang="en">
      <head><meta charset="utf-8" /><title>{{ title }}</title></head>
      <body>{{ content | safe }}</body>
    </html>
  src/posts/field-recording.md: |
    ---
    title: Field recording in January
    tags: post
    ---

    The best microphone is the one you took outside.
  src/css/site.css: |
    body { max-width: 38rem; margin: 4rem auto; }
