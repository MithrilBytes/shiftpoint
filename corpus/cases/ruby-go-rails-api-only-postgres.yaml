id: ruby-go-rails-api-only-postgres
origin: "Rails in API only mode serving JSON to a separate front end, backed by Postgres. Generated by `rails new --api`."
expect:
  stage: app-on-free-managed-hosting-with-database
  flags: []
files:
  Gemfile: |
    source "https://rubygems.org"
    gem "rails", "~> 7.1.3"
    gem "pg", "~> 1.5"
    gem "puma", ">= 6.4"
    gem "jbuilder"
    gem "rack-cors"
  config/application.rb: |
    require_relative "boot"
    require "rails/all"

    module Orders
      class Application < Rails::Application
        config.load_defaults 7.1
        config.api_only = true
      end
    end
  config/database.yml: |
    production:
      adapter: postgresql
      url: <%= ENV["DATABASE_URL"] %>
  app/controllers/api/v1/orders_controller.rb: |
    module Api
      module V1
        class OrdersController < ApplicationController
          def index
            render json: Order.recent.limit(100)
          end
        end
      end
    end
  app/models/order.rb: |
    class Order < ApplicationRecord
      scope :recent, -> { order(placed_at: :desc) }
    end
