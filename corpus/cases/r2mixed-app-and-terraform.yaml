id: r2mixed-app-and-terraform
origin: >-
  A Rails app that keeps the Terraform for its own infrastructure in `infra/`:
  one EC2 instance running puma and an RDS Postgres beside it. No jobs, no
  queue, no Redis. A very ordinary shape for a five year old internal app whose
  team decided the infrastructure belonged next to the code.
expect:
  stage: app-with-managed-database
  flags: []
files:
  Gemfile: |
    source "https://rubygems.org"

    gem "rails", "~> 7.1.3"
    gem "pg", "~> 1.5"
    gem "puma", "~> 6.4"
    gem "bootsnap", require: false
  config/database.yml: |
    default: &default
      adapter: postgresql
      encoding: unicode
      pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

    production:
      <<: *default
      url: <%= ENV["DATABASE_URL"] %>
  app/models/invoice.rb: |
    class Invoice < ApplicationRecord
      belongs_to :account
      scope :overdue, -> { where("due_on < ?", Date.current).where(paid_at: nil) }
    end
  infra/main.tf: |
    provider "aws" {
      region = var.region
    }

    resource "aws_db_instance" "primary" {
      identifier           = "ledger-primary"
      engine               = "postgres"
      engine_version       = "16.3"
      instance_class       = "db.t4g.small"
      allocated_storage    = 50
      db_name              = "ledger"
      username             = var.db_username
      password             = var.db_password
      skip_final_snapshot  = false
    }

    resource "aws_instance" "app" {
      ami           = var.app_ami
      instance_type = "t3.small"
      tags = { Name = "ledger-app" }
    }
  infra/variables.tf: |
    variable "region" { default = "eu-west-1" }
    variable "app_ami" { type = string }
    variable "db_username" { type = string }
    variable "db_password" {
      type      = string
      sensitive = true
    }
  README.md: |
    # ledger

    Rails app for the finance team. `infra/` is the Terraform that creates the
    box it runs on and the Postgres it talks to. `terraform apply` then
    `cap production deploy`.
