id: r2stack-symfony-messenger-worker
origin: >-
  Symfony 7 booking app for a driving school. Doctrine on Postgres holds the
  lessons, and Symfony Messenger sends the reminder texts through a Doctrine
  transport that a separate `messenger:consume` process drains. The Procfile
  declares the worker alongside the web process, so the worker is not optional:
  stop it and reminders queue up unsent.
expect:
  stage: app-with-background-work
  flags: []
files:
  composer.json: |
    {
      "name": "kirkby/lessons",
      "type": "project",
      "require": {
        "php": ">=8.2",
        "symfony/framework-bundle": "7.1.*",
        "symfony/runtime": "7.1.*",
        "symfony/messenger": "7.1.*",
        "symfony/doctrine-messenger": "7.1.*",
        "doctrine/doctrine-bundle": "^2.12",
        "doctrine/orm": "^3.2"
      },
      "autoload": { "psr-4": { "App\\": "src/" } }
    }
  .env: |
    APP_ENV=prod
    DATABASE_URL="postgresql://lessons:secret@db.internal:5432/lessons?serverVersion=16"
    MESSENGER_TRANSPORT_DSN=doctrine://default?queue_name=reminders
  config/packages/messenger.yaml: |
    framework:
        messenger:
            transports:
                async:
                    dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                    retry_strategy:
                        max_retries: 3
            routing:
                'App\Message\SendLessonReminder': async
  src/Message/SendLessonReminder.php: |
    <?php

    namespace App\Message;

    final class SendLessonReminder
    {
        public function __construct(public readonly int $lessonId)
        {
        }
    }
  src/MessageHandler/SendLessonReminderHandler.php: |
    <?php

    namespace App\MessageHandler;

    use App\Message\SendLessonReminder;
    use App\Repository\LessonRepository;
    use App\Sms\Gateway;
    use Symfony\Component\Messenger\Attribute\AsMessageHandler;

    #[AsMessageHandler]
    final class SendLessonReminderHandler
    {
        public function __construct(
            private LessonRepository $lessons,
            private Gateway $sms,
        ) {
        }

        public function __invoke(SendLessonReminder $message): void
        {
            $lesson = $this->lessons->find($message->lessonId);
            $this->sms->send($lesson->getPupilMobile(), $lesson->reminderText());
        }
    }
  Procfile: |
    web: heroku-php-apache2 public/
    worker: php bin/console messenger:consume async --time-limit=3600 --memory-limit=192M
  README.md: |
    # lessons

    Booking and reminders for Kirkby School of Motoring.

    Two processes. The web process serves the booking pages; the worker drains
    the `reminders` queue and sends the texts. Both must be running.
