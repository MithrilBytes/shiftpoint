apiVersion: apps/v1
kind: Deployment
metadata:
  name: shortlink
  labels:
    app: shortlink
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shortlink
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: shortlink
    spec:
      containers:
        - name: shortlink
          image: ghcr.io/example/shortlink:1.0.0
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
