apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shortlink
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - go.example.com
      secretName: shortlink-tls
  rules:
    - host: go.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shortlink
                port:
                  number: 80
